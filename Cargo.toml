[package]
name = "relic"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
description = "A recoverable, bounded backup and synchronization system"
repository = "https://github.com/mayazrakib/relic"
default-run = "relic"

[features]
default = []
embedded-archive = ["dep:rustic_core", "dep:rustic_backend"]

[[bin]]
name = "relic"
path = "src/main.rs"

[[bin]]
name = "relicd"
path = "src/bin/relicd.rs"

[dependencies]
base64 = "=0.23.1"
chrono = { version = "=0.4.45", features = ["serde"] }
chrono-tz = "=0.10.4"
chacha20poly1305 = { version = "=0.11.0", default-features = false, features = ["alloc", "zeroize"] }
clap = { version = "=4.6.7", features = ["derive"] }
getrandom = "=0.4.3"
jsonschema = { version = "=0.61.1", default-features = false }
libc = "=0.2.191"
rusqlite = { version = "=0.41.1", features = ["bundled", "backup"] }
rustic_core = { version = "=0.13.0", default-features = false, optional = true }
rustic_backend = { version = "=0.7.0", default-features = false, optional = true }
serde = { version = "=1.0.229", features = ["derive"] }
serde_jcs = "=0.2.0"
serde_json = "=1.0.154"
sha2 = "=0.11.1"
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "macros", "net", "io-util", "signal", "sync", "time"] }
toml = "=0.9.8"
uuid = { version = "=1.29.2", features = ["v7", "serde"] }
zeroize = "=1.9.1"

[dev-dependencies]
tempfile = "=3.27.0"

[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false
