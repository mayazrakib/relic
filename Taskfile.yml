version: '3'

tasks:
    default:
        desc: Display available tasks.
        cmds:
            - task --list
    help:
        desc: Describe available tasks.
        cmds:
            - task --list
    init:
        desc: Fetch the locked Rust dependencies.
        cmds:
            - python3 tools/check.py fetch --locked
    build:
        desc: Build the daemon and command-line interface.
        cmds:
            - python3 tools/check.py build --locked
    check:
        desc: Check the Rust targets without rewriting files.
        cmds:
            - python3 tools/check.py check --locked --all-targets
    test:
        desc: Run the implemented Rust acceptance checks.
        cmds:
            - python3 tools/check.py test --locked
    conformance:
        desc: Verify schemas, vectors, and contract rejection cases.
        cmds:
            - python3 tools/check.py test --locked --test contracts
